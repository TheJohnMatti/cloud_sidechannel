[project]
name = "csc"
version = "0.1.0"
description = "Cloud side-channel analysis — nowcast hyperscaler cloud-segment revenue from the elasticity primitives of AWS / Azure / GCP"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "duckdb>=1.0",
    "pyarrow>=15",
    "boto3>=1.34",
    "httpx>=0.27",
    "pydantic>=2.6",
    "structlog>=24.1",
    "tenacity>=8.2",
]

[project.optional-dependencies]
azure = ["azure-identity>=1.16", "azure-mgmt-compute>=31", "azure-mgmt-resource>=23"]
gcp = ["google-cloud-compute>=1.19"]
nowcast = ["statsmodels>=0.14", "scikit-learn>=1.4"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
csc = "csc.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true

[tool.setuptools]
packages = ["csc"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
